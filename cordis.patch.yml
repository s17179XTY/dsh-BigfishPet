# bigfish-pet — 本文件必须是空 patch！
#
# 插件通过 bundle 机制挂载（profile package.json 的 dsh.profile.bundles 包含
# "bigfish-pet"，或用 `dsh plugin --profile web add github:s17179XTY/dsh-BigfishPet`
# 安装）。DSH 的 bundle 加载器会**自动应用**本文件作为该 bundle 的 patch——
# 如果这里再 `- insert: id: bigfish-pet`，就会与 bundle 自身的 loader entry
# 重复，启动报 "duplicate loader entry id: bigfish-pet" 并崩溃（已踩坑）。
#
# 手动复制安装的用户：在 profile 的 cordis.patch.yml（不是本文件）里添加：
#   - insert:
#       - id: bigfish-pet
#         name: 'bigfish-pet'
[]
