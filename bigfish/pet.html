<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #14141a;
      overflow: hidden;
      user-select: none;
      cursor: grab;
    }
    #bubble {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      box-sizing: border-box; /* max-width includes padding so the bubble never overflows the window */
      /* dsh-dafeiyu 同款：大卡片（360px 级）、大圆角 30px、近白白卡 +
         浅灰细边框。无 box-shadow（不透明窗口下阴影会落在深色背景上变成
         黑块）。圆角四角由 setShape 5 矩形逼近裁剪（四角透桌面）。 */
      background: #fcfcfd;
      color: #25282d;
      border: 1px solid rgba(218, 221, 226, 0.9);
      border-radius: 30px;
      padding: 14px 20px;
      font-size: 16px;
      line-height: 1.5;
      width: max-content;
      max-width: 360px;
      white-space: normal;
      word-break: break-word;
      text-align: left;
      display: none;
      z-index: 2;
    }
    #bubble.show { display: block; animation: pop .18s ease-out; }
    #bubble-detail {
      display: block;
      font-size: 12px;
      color: #747981;
      margin-top: 4px;
      line-height: 1.45;
      white-space: normal;
      word-break: break-word;
      padding-right: 44px; /* 给右侧状态图标留位 */
    }
    /* 状态图标（dsh-dafeiyu 同款）：浅底 + 深色图形。
       思考 #E2ECFF/#4C78E8 三点、工作 #DDEBFF/#3478F6 三点、
       等待 #FFF0CE/#D88A00 感叹号、完成 #D9F7E4/#12B85A 对勾、
       出错 #FDE3E3/#E5484D 红叉。 */
    #bubble-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
    }
    #bubble-icon.show { display: flex; }
    #bubble-icon.thinking { background: #E2ECFF; color: #4C78E8; }
    #bubble-icon.working { background: #DDEBFF; color: #3478F6; }
    #bubble-icon.waiting { background: #FFF0CE; color: #D88A00; }
    #bubble-icon.success { background: #D9F7E4; color: #12B85A; }
    #bubble-icon.error { background: #FDE3E3; color: #E5484D; }
    #bubble-icon .dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      margin: 0 1.5px;
    }
    #pet {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      display: block;
      pointer-events: none;
      object-fit: contain;
    }
    @keyframes pop {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="bubble"><span id="bubble-icon"></span><span id="bubble-msg"></span><span id="bubble-detail"></span></div>
  <img id="pet" src="assets/pet/idle.png" draggable="false" alt="" style="width: 157px; height: 157px">
  <script src="pet.js"></script>
</body>
</html>
