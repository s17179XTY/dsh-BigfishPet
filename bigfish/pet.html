<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #14141a;
      overflow: hidden;
      user-select: none;
      cursor: grab;
    }
    #bubble {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      box-sizing: border-box; /* max-width includes padding so the bubble never overflows the window */
      background: #fff;
      color: #333;
      padding: 6px 11px;
      /* 不透明窗口 + setShape 裁剪下，圆角四角会露出深色窗口背景（黑边感），
         阴影更会沿裁剪线留下深色残留——所以用方形白卡、无阴影。 */
      border-radius: 3px;
      font-size: 12px;
      line-height: 1.4;
      width: max-content;
      max-width: 168px;
      white-space: normal;
      word-break: break-word;
      text-align: center;
      display: none;
      z-index: 2;
    }
    #bubble.show { display: block; animation: pop .18s ease-out; }
    #bubble-detail {
      display: block;
      font-size: 10px;
      opacity: 0.65;
      margin-top: 2px;
      line-height: 1.35;
      white-space: normal;
      word-break: break-word;
    }
    #pet {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      display: block;
      pointer-events: none;
      object-fit: contain;
    }
    @keyframes pop {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="bubble"><span id="bubble-msg"></span><span id="bubble-detail"></span></div>
  <img id="pet" src="assets/pet/idle.png" draggable="false" alt="" style="width: 157px; height: 157px">
  <script src="pet.js"></script>
</body>
</html>
