<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #14141a;
      overflow: hidden;
      user-select: none;
      cursor: grab;
    }
    #bubble {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      box-sizing: border-box; /* max-width includes padding so the bubble never overflows the window */
      /* 大肥鱼同款观感：近白白卡 + 浅灰细边框 + 圆角。无 box-shadow——
         不透明窗口下阴影会落在深色背景上变成黑块。圆角四角由 setShape
         的 5 矩形逼近裁剪（四角透桌面），不会露出深色背景。 */
      background: #fcfcfd;
      color: #25282d;
      border: 1px solid rgba(218, 221, 226, 0.9);
      border-radius: 10px;
      padding: 7px 13px;
      font-size: 12px;
      line-height: 1.4;
      width: max-content;
      max-width: 168px;
      white-space: normal;
      word-break: break-word;
      text-align: left;
      display: none;
      z-index: 2;
    }
    #bubble.show { display: block; animation: pop .18s ease-out; }
    #bubble-detail {
      display: block;
      font-size: 10px;
      color: #747981;
      margin-top: 2px;
      line-height: 1.35;
      white-space: normal;
      word-break: break-word;
      padding-right: 26px; /* 给右侧状态图标留位 */
    }
    /* 状态图标（大肥鱼同款）：思考/工作=蓝三点、等待=黄感叹号、
       完成=绿对勾、出错=红叉。圆形底色 + 白色图形。 */
    #bubble-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }
    #bubble-icon.show { display: flex; }
    #bubble-icon.thinking, #bubble-icon.working { background: #2f81f7; }
    #bubble-icon.waiting { background: #e8a13a; }
    #bubble-icon.success { background: #2ea043; }
    #bubble-icon.error { background: #f85149; }
    #bubble-icon .dot {
      display: inline-block;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
      margin: 0 1px;
    }
    #pet {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      display: block;
      pointer-events: none;
      object-fit: contain;
    }
    @keyframes pop {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="bubble"><span id="bubble-icon"></span><span id="bubble-msg"></span><span id="bubble-detail"></span></div>
  <img id="pet" src="assets/pet/idle.png" draggable="false" alt="" style="width: 157px; height: 157px">
  <script src="pet.js"></script>
</body>
</html>
